name: build-apk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project into repo
        run: |
          if [ ! -f app/build.gradle.kts ]; then
          cat > settings.gradle.kts <<'STROID_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "stroid"
          include(":app")
          STROID_EOF
          cat > build.gradle.kts <<'STROID_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          STROID_EOF
          cat > gradle.properties <<'STROID_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          STROID_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'STROID_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "app.stroid"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.stroid"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          STROID_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'STROID_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Stroid"
                  android:theme="@style/Theme.Stroid"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          STROID_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'STROID_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Stroid" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#1e1f22</item>
                  <item name="android:statusBarColor">#1e1f22</item>
                  <item name="android:navigationBarColor">#1e1f22</item>
              </style>
          </resources>
          STROID_EOF
          mkdir -p app/src/main/java/app/stroid
          cat > app/src/main/java/app/stroid/MainActivity.kt <<'STROID_EOF'
          package app.stroid

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader
          import java.io.File

          class MainActivity : AppCompatActivity() {

              private lateinit var web: WebView
              private lateinit var root: File

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  root = File(filesDir, "projects").apply { mkdirs() }

                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  web = WebView(this)
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest) =
                          loader.shouldInterceptRequest(request.url)
                  }
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.addJavascriptInterface(Bridge(), "Android")
                  setContentView(web)
                  web.loadUrl("https://appassets.androidplatform.net/assets/editor.html")
              }

              inner class Bridge {
                  private fun safe(path: String): File {
                      val f = File(root, path).canonicalFile
                      require(f.path.startsWith(root.canonicalPath + File.separator)) { "bad path" }
                      return f
                  }

                  @JavascriptInterface
                  fun list(): String = runCatching {
                      root.walkTopDown().filter { it.isFile }
                          .joinToString("\n") { it.relativeTo(root).path }
                  }.getOrDefault("")

                  @JavascriptInterface
                  fun read(path: String): String = runCatching { safe(path).readText() }.getOrDefault("")

                  @JavascriptInterface
                  fun write(path: String, content: String): Boolean = runCatching {
                      val f = safe(path)
                      f.parentFile?.mkdirs()
                      f.writeText(content)
                      true
                  }.getOrDefault(false)

                  @JavascriptInterface
                  fun delete(path: String): Boolean = runCatching { safe(path).delete() }.getOrDefault(false)
              }
          }
          STROID_EOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/editor.html <<'STROID_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
          <title>Stroid</title>
          <style>
            :root { --bg:#1e1f22; --bar:#2b2d30; --line:#393b40; --fg:#dfe1e5; --mut:#8a8d93; --acc:#5b8def; }
            * { box-sizing: border-box; }
            html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font-family: system-ui, sans-serif; overflow:hidden; }
            #app { display:flex; flex-direction:column; height:100%; }
            #tabs { display:flex; background:var(--bar); border-bottom:1px solid var(--line); overflow-x:auto; flex:none; }
            .tab { padding:10px 12px; font-size:13px; color:var(--mut); white-space:nowrap; border-top:2px solid transparent; }
            .tab.on { color:var(--fg); background:var(--bg); border-top-color:var(--acc); }
            #main { flex:1; position:relative; min-height:0; }
            #editor { position:absolute; inset:0; }
            #files { position:absolute; inset:0; background:var(--bg); overflow:auto; display:none; padding:8px; }
            .row { display:flex; align-items:center; padding:12px; border-bottom:1px solid var(--line); font-size:14px; }
            .row span { flex:1; }
            .row b { color:#e06c6c; font-weight:400; padding:0 8px; }
            #keys { display:flex; gap:4px; padding:6px; background:var(--bar); border-top:1px solid var(--line); flex:none; }
            #keys button { flex:1; padding:9px 0; font-size:14px; background:var(--line); color:var(--fg);
              border:0; border-radius:4px; font-family:ui-monospace, monospace; }
            #nav { display:flex; background:var(--bg); border-top:1px solid var(--line); flex:none;
              padding-bottom: env(safe-area-inset-bottom, 0px); }
            #nav button { flex:1; padding:12px 0; background:none; border:0; color:var(--mut); font-size:12px; }
            #nav button.on { color:var(--acc); }
            #nav button:disabled { opacity:.4; }
          </style>
          </head>
          <body>
          <div id="app">
            <div id="tabs"></div>
            <div id="main">
              <div id="editor"></div>
              <div id="files"></div>
            </div>
            <div id="keys"></div>
            <div id="nav">
              <button id="nFiles">Files</button>
              <button id="nEditor" class="on">Editor</button>
              <button id="nSave">Save</button>
              <button disabled>Terminal</button>
            </div>
          </div>

          <script src="monaco/vs/loader.js"></script>
          <script>
          var base = location.origin + '/assets/monaco';
          self.MonacoEnvironment = {
            getWorkerUrl: function () {
              return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
                "self.MonacoEnvironment={baseUrl:'" + base + "/'};importScripts('" + base + "/vs/base/worker/workerMain.js');");
            }
          };
          require.config({ paths: { vs: 'monaco/vs' } });

          require(['vs/editor/editor.main'], function () {
            var models = {};
            var current = null;
            var editor = monaco.editor.create(document.getElementById('editor'), {
              theme: 'vs-dark', automaticLayout: true, fontSize: 14, minimap: { enabled: false },
              wordWrap: 'on', scrollBeyondLastLine: false
            });

            function langFor(path) {
              var ext = '.' + path.split('.').pop().toLowerCase();
              var all = monaco.languages.getLanguages();
              for (var i = 0; i < all.length; i++) {
                if ((all[i].extensions || []).indexOf(ext) >= 0) return all[i].id;
              }
              return 'plaintext';
            }

            function renderTabs() {
              var el = document.getElementById('tabs');
              el.innerHTML = '';
              Object.keys(models).forEach(function (p) {
                var t = document.createElement('div');
                t.className = 'tab' + (p === current ? ' on' : '');
                t.textContent = p.split('/').pop();
                t.onclick = function () { openFile(p); };
                t.oncontextmenu = function (e) { e.preventDefault(); closeTab(p); };
                el.appendChild(t);
              });
              var plus = document.createElement('div');
              plus.className = 'tab';
              plus.textContent = '+';
              plus.onclick = newFile;
              el.appendChild(plus);
            }

            function showPanel(name) {
              document.getElementById('files').style.display = name === 'files' ? 'block' : 'none';
              document.getElementById('nFiles').className = name === 'files' ? 'on' : '';
              document.getElementById('nEditor').className = name === 'editor' ? 'on' : '';
              if (name === 'files') renderFiles();
            }

            function openFile(p) {
              if (!models[p]) {
                models[p] = monaco.editor.createModel(Android.read(p), langFor(p));
              }
              current = p;
              editor.setModel(models[p]);
              renderTabs();
              showPanel('editor');
            }

            function closeTab(p) {
              if (!models[p]) return;
              models[p].dispose();
              delete models[p];
              var left = Object.keys(models);
              if (current === p) {
                current = left.length ? left[0] : null;
                if (current) editor.setModel(models[current]);
              }
              renderTabs();
            }

            function newFile() {
              var name = prompt('File name', 'new.py');
              if (!name) return;
              if (!Android.write(name, '')) { alert('Could not create file'); return; }
              openFile(name);
            }

            function save() {
              if (!current) return;
              if (!Android.write(current, models[current].getValue())) alert('Save failed');
            }

            function renderFiles() {
              var el = document.getElementById('files');
              el.innerHTML = '';
              var list = Android.list().split('\n').filter(Boolean);
              list.forEach(function (p) {
                var r = document.createElement('div');
                r.className = 'row';
                var s = document.createElement('span');
                s.textContent = p;
                s.onclick = function () { openFile(p); };
                var d = document.createElement('b');
                d.textContent = 'Delete';
                d.onclick = function () {
                  if (confirm('Delete ' + p + '?')) { closeTab(p); Android.delete(p); renderFiles(); }
                };
                r.appendChild(s); r.appendChild(d);
                el.appendChild(r);
              });
              var add = document.createElement('div');
              add.className = 'row';
              add.innerHTML = '<span style="color:var(--acc)">+ New file</span>';
              add.onclick = newFile;
              el.appendChild(add);
            }

            var keys = [['Tab', '  '], ['{', '{'], ['}', '}'], ['[', '['], [']', ']'],
                        ['(', '('], [')', ')'], [';', ';'], ['Undo', null], ['Redo', null]];
            var kb = document.getElementById('keys');
            keys.forEach(function (k) {
              var b = document.createElement('button');
              b.textContent = k[0];
              b.onmousedown = function (e) { e.preventDefault(); };
              b.onclick = function () {
                editor.focus();
                if (k[0] === 'Undo') editor.trigger('keys', 'undo', null);
                else if (k[0] === 'Redo') editor.trigger('keys', 'redo', null);
                else editor.trigger('keys', 'type', { text: k[1] });
              };
              kb.appendChild(b);
            });

            document.getElementById('nFiles').onclick = function () { showPanel('files'); };
            document.getElementById('nEditor').onclick = function () { showPanel('editor'); };
            document.getElementById('nSave').onclick = save;

            var existing = Android.list().split('\n').filter(Boolean);
            if (!existing.length) {
              Android.write('main.py', 'def greet(name):\n    return f"Hello {name}"\n\nprint(greet("Stroid"))\n');
              existing = ['main.py'];
            }
            openFile(existing[0]);
          });
          </script>
          </body>
          </html>
          STROID_EOF
          cat > .gitignore <<'STROID_EOF'
          .gradle/
          build/
          local.properties
          node_modules/
          app/src/main/assets/monaco/
          *.iml
          .idea/
          STROID_EOF
          cat > README.md <<'STROID_EOF'
          # Stroid

          بيئة تطوير لأندرويد تعمل أوفلاين. المرحلة 1: المحرر (Monaco) وإدارة الملفات.

          ## البناء
          1. ارفع المشروع إلى GitHub.
          2. افتح تبويب Actions وشغّل `build-apk`.
          3. نزّل `stroid-debug-apk` من نتيجة التشغيل وثبّته على الجوال.

          محرر Monaco ينزّل ويُضمَّن في الـ APK وقت البناء، ولا يحتاج التطبيق إنترنت بعد التثبيت.

          ## المراحل القادمة
          2. Terminal وبيئة Linux (proot)  3. اللغات ومتجرها  4. دعم الذكاء الاصطناعي
          STROID_EOF
          git config user.name "stroid-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Add Stroid phase 1 project"
          git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle Monaco for offline use
        run: |
          npm install --no-save monaco-editor@0.52.0
          mkdir -p app/src/main/assets/monaco
          cp -r node_modules/monaco-editor/min/vs app/src/main/assets/monaco/vs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: stroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
